provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

functions:
  llm:
    lang: python3-flask-debian
    handler: ./function
    image: localhost:5000/llm:latest
    min_replicas: 1
    build_args:
      ADDITIONAL_PACKAGE: ""
  environment:
      MODEL_BACKEND: "gpt4all"   # or "chatgpt", "gemini", "perplexity", "deepseek"
      OFFLINE_MODEL_NAME: "/models/mistral-7b-instruct-v0.1.Q4_0.gguf"
      OFFLINE_MODEL_URL: "https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.1-GGUF/resolve/main/mistral-7b-instruct-v0.1.Q4_0.gguf"
      MODEL_API_TOKEN: "your_api_key_here"   # required for remote backends
    volumes:
      - /var/openfaas/models:/models
    annotations:
      com.openfaas.health.http.path: "/healthz"
      com.openfaas.health.http.initialDelaySeconds: "10"
      com.openfaas.health.http.timeoutSeconds: "2"
      com.openfaas.health.http.periodSeconds: "5"      
      

